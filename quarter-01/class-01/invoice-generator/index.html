<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Theme Toggle -->
<button class="theme-toggle" id="themeToggle" title="Toggle Theme">
  <i class="fas fa-sun"></i>
</button>

<div class="app-container">
  <!-- ============ SIDEBAR: Product Management ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2><i class="fas fa-box"></i> Products</h2>
      <button class="btn btn-icon" id="toggleSidebar" title="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="product-form-card">
      <h3>Add Product</h3>
      <div class="form-group">
        <input type="text" id="productName" placeholder="Product name" />
      </div>
      <div class="form-group">
        <input type="number" id="productPrice" placeholder="Unit price" step="0.01" min="0" />
      </div>
      <div class="form-row">
        <button class="btn btn-primary" id="saveProductBtn"><i class="fas fa-save"></i> Save</button>
        <button class="btn btn-secondary" id="cancelEditProductBtn" style="display:none"><i class="fas fa-times"></i> Cancel</button>
      </div>
    </div>

    <div class="product-list" id="productList">
      <!-- Rendered by JS -->
    </div>
  </aside>

  <!-- ============ MAIN: Invoice ============ -->
  <main class="main-content">
    <!-- Mobile sidebar toggle -->
    <button class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn" title="Products">
      <i class="fas fa-box"></i>
    </button>

    <div class="invoice-container" id="invoice">
      <!-- Invoice Header -->
      <div class="invoice-header">
        <div class="invoice-brand">
          <div class="invoice-logo">
            <i class="fas fa-file-invoice"></i>
          </div>
          <div>
            <h1>INVOICE</h1>
            <p class="invoice-subtitle">Payment Receipt</p>
          </div>
        </div>
        <div class="invoice-badge" id="invoiceBadge">
          <span>#<span id="invoiceNumber">001</span></span>
        </div>
      </div>

      <!-- Invoice Meta -->
      <div class="invoice-meta">
        <div class="meta-section">
          <label>Date</label>
          <input type="date" id="invoiceDate" class="input-underline" />
        </div>
        <div class="meta-section">
          <label>Due Date</label>
          <input type="date" id="dueDate" class="input-underline" />
        </div>
      </div>

      <!-- Bill To -->
      <div class="bill-to">
        <label>Bill To</label>
        <input type="text" id="recipientName" placeholder="Recipient Name" class="input-underline" />
        <input type="text" id="recipientAddress" placeholder="Address (optional)" class="input-underline" />
        <input type="email" id="recipientEmail" placeholder="Email (optional)" class="input-underline" />
      </div>

      <!-- Items Table -->
      <div class="table-wrapper">
        <table class="items-table" id="itemsTable">
          <thead>
            <tr>
              <th style="width:35%">Item</th>
              <th style="width:20%">Description</th>
              <th style="width:12%">Qty</th>
              <th style="width:16%">Price</th>
              <th style="width:12%">Total</th>
              <th style="width:5%"></th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <!-- Rows rendered by JS -->
          </tbody>
        </table>
      </div>

      <div class="table-actions">
        <button class="btn btn-outline" id="addRowBtn">
          <i class="fas fa-plus"></i> Add Item
        </button>
      </div>

      <!-- Totals -->
      <div class="totals-section">
        <div class="totals-left">
          <div class="form-group">
            <label>Notes / Terms</label>
            <textarea id="notes" rows="3" placeholder="Payment terms, notes..."></textarea>
          </div>
          <div class="signature-area">
            <label>Signature</label>
            <canvas id="signatureCanvas" width="300" height="80"></canvas>
            <div class="sig-actions">
              <button class="btn btn-sm" id="clearSignature"><i class="fas fa-eraser"></i> Clear</button>
            </div>
          </div>
        </div>
        <div class="totals-right">
          <div class="total-row">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="total-row">
            <span>Tax (%)</span>
            <input type="number" id="taxRate" value="0" min="0" max="100" step="0.1" class="input-underline tax-input" />
          </div>
          <div class="total-row">
            <span>Discount</span>
            <input type="number" id="discount" value="0" min="0" step="1" class="input-underline tax-input" />
          </div>
          <div class="total-row grand-total">
            <span>Total</span>
            <span id="grandTotal">$0.00</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-bar">
        <button class="btn btn-primary" id="printBtn">
          <i class="fas fa-print"></i> Print
        </button>
        <button class="btn btn-primary" id="exportPdfBtn">
          <i class="fas fa-file-pdf"></i> Export PDF
        </button>
        <button class="btn btn-success" id="exportExcelBtn">
          <i class="fas fa-file-excel"></i> Export Excel
        </button>
        <button class="btn btn-danger" id="resetInvoiceBtn">
          <i class="fas fa-trash"></i> New Invoice
        </button>
      </div>

      <div class="footer-note">
        <p>Invoice Generator &mdash; Thank you for your business!</p>
      </div>
    </div>
  </main>
</div>

<!-- Signature Modal -->
<div class="modal-overlay" id="sigModal">
  <div class="modal-content">
    <h3>Draw your signature</h3>
    <canvas id="sigModalCanvas" width="400" height="150"></canvas>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="sigClearBtn"><i class="fas fa-eraser"></i> Clear</button>
      <button class="btn btn-primary" id="sigAcceptBtn"><i class="fas fa-check"></i> Accept</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
